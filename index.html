        var dark = c === 'night' || (c === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var bg = dark ? '#12142B' : '#F5F1E6'; // the flat look's Night and Day grounds (src/theme/palettes.ts)
        document.documentElement.style.background = bg;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', dark ? 'night' : 'day');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', bg);
        var st = document.createElement('style');
        st.textContent = 'html, body { background: ' + bg + ' !important; } .boot { color: ' + (dark ? '#A9A7B8' : '#575670') + ' !important; }';
        document.head.appendChild(st);
      })();

      // When a newer version takes over while the app is open, tell the app so it can offer a refresh.
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {

          navigator.serviceWorker.addEventListener('controllerchange', function () {
