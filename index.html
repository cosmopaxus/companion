    <style id="expo-reset">
      html, body { height: 100%; background: #121915; }
      body { overflow: hidden; margin: 0; }
      #root { display: flex; height: 100%; flex: 1; }
      .boot { margin: auto; font: 16px/1.5 Georgia, "Iowan Old Style", serif; color: #625D53; }
    </style>
    <script>
      // Paint the right page color before the app loads, so Night never flashes white.
      (function () {
        var c = 'night'; // Night is the default (Oct 15)
        try { c = localStorage.getItem('companion.v2.theme') || 'night'; } catch (e) {}
        var dark = c === 'night' || (c === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var bg = dark ? '#121915' : '#F7F0E5';
        document.documentElement.style.background = bg;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', dark ? 'night' : 'day');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', bg);
        var st = document.createElement('style');
        st.textContent = 'html, body { background: ' + bg + ' !important; } .boot { color: ' + (dark ? '#ADA796' : '#625D53') + ' !important; }';
        document.head.appendChild(st);
      })();
    </script>
  <meta name="theme-color" content="#F7F0E5">
<meta name="description" content="A practice for becoming. Notice where you are, choose what matters, practice a direction, and see what changes.">

    <noscript><p class="boot">Equilibrium needs JavaScript to run.</p></noscript>
    <div id="root"><p class="boot">Opening Equilibrium…</p></div>
    <script>
      // Offline support: a small service worker keeps the app shell available after the first visit.
      // When a newer version takes over while the app is open, tell the app so it can offer a refresh.
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', function () {
          var hadController = !!navigator.serviceWorker.controller;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadController) { hadController = true; return; } // first install, not an update
            window.__companionUpdateReady = true;
            window.dispatchEvent(new Event('companion-update-ready'));
          });
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            var check = function () { reg.update().catch(function () {}); };
            setInterval(check, 30 * 60 * 1000);
            document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
          }).catch(function () {});
        });
      }
    </script>
